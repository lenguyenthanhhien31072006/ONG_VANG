services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mini_ong_vang_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      DATABASE_NAME: ${MSSQL_DATABASE:-mini_ong_vang_design_v1}
    volumes:
      - ./scripts/init-sqlserver.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        [[ "$$DATABASE_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]{0,127}$$ ]] || exit 1
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -v DatabaseName="$$DATABASE_NAME" -i /init.sql
    depends_on:
      sqlserver:
        condition: service_healthy

  backend:
    build:
      context: ./src/backend

    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE:-mini_ong_vang_design_v1};encrypt=true;trustServerCertificate=true"
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ROUTE_PROVIDER: ${ROUTE_PROVIDER:-fake}
      ROUTE_MAX_DISTANCE_KM: ${ROUTE_MAX_DISTANCE_KM:-30}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      GOONG_TIMEOUT_MS: ${GOONG_TIMEOUT_MS:-5000}
      GOONG_VEHICLE: ${GOONG_VEHICLE:-car}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      DRIVER_RETURN_URL: ${DRIVER_RETURN_URL:-http://localhost:3001/driver/orders}
      VNPAY_QUERY_IP: ${VNPAY_QUERY_IP:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mini Ong Vang}

    ports:
      - "8081:8080"

    depends_on:
      db-init:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./src/frontend
      args:
        NEXT_PUBLIC_GOONG_MAPTILES_KEY: ${GOONG_API_MAPTILES_KEY:-}

    ports:
      - "3001:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_GOONG_MAPTILES_KEY: ${GOONG_API_MAPTILES_KEY:-}
      BACKEND_INTERNAL_URL: http://backend:8080

    depends_on:
      - backend


volumes:
  mini_ong_vang_mssqldata:
