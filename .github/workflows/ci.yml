name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:18081
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tx4

  backend:
    name: Backend tests and API smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mini-ong-vang-ci
      TEST_DB_URL: jdbc:sqlserver://127.0.0.1:15433;databaseName=mini_ong_vang_test;encrypt=true;trustServerCertificate=true
      TEST_DB_USER: sa
      REQUIRE_TEST_DB: 'true'
      API_BASE_URL: http://127.0.0.1:18081
      API_EXPECTED_DATABASE: mini_ong_vang_test
      DEMO_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/api/package-lock.json
      - name: Install API tools without rewriting committed vendor files
        run: npm ci --ignore-scripts --prefix tools/api
      - name: Validate contract, examples, Postman and CSRF tests
        run: npm run check --prefix tools/api
      - name: Generate disposable SQL Server credentials
        run: echo "TEST_DB_PASSWORD=Aa!$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate isolated Compose configuration
        run: docker compose -f docker-compose.ci.yml config --quiet
      - name: Start isolated SQL Server 2022
        run: |
          docker compose -f docker-compose.ci.yml up --wait --wait-timeout 180 db-test
          docker compose -f docker-compose.ci.yml up --no-deps --exit-code-from db-init-test db-init-test
      - name: Build WAR and run Java tests against test database
        run: mvn --batch-mode --no-transfer-progress -f src/backend/pom.xml verify
      - name: Prepare isolated demo fixtures for HTTP dispatch tests
        run: |
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d mini_ong_vang_test < scripts/reset-test-db.sql
          mvn --batch-mode --no-transfer-progress -f src/backend/pom.xml exec:java -Dexec.mainClass=com.miniongvang.seed.SeedCommand -Dexec.args=test
      - name: Start backend after database tests finish
        run: docker compose -f docker-compose.ci.yml up --build --wait --wait-timeout 120 backend-test
      - name: Smoke test deployed API and documentation
        run: npm run smoke --prefix tools/api
      - name: Smoke test T10 order creation
        run: npm run smoke:orders --prefix tools/api
      - name: Smoke test T16 order history and detail
        run: npm run smoke:history --prefix tools/api
      - name: Smoke test T13 cancellation
        run: npm run smoke:cancel --prefix tools/api
      - name: Smoke test T17 reports and Excel
        run: npm run smoke:reports --prefix tools/api
      - name: Smoke test T14 cash payment
        run: npm run smoke:payment --prefix tools/api
      - name: Smoke test T11 dispatch and concurrent assignment
        run: npm run smoke:dispatch --prefix tools/api
      - name: Reconcile designV1 after payments and dispatch before reset
        run: docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d mini_ong_vang_test < scripts/check-design-v1-invariants.sql
      - name: Isolate demo fixtures for T12 progress checks
        run: |
          docker compose -f docker-compose.ci.yml stop backend-test
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d mini_ong_vang_test < scripts/reset-test-db.sql
          mvn --batch-mode --no-transfer-progress -f src/backend/pom.xml exec:java -Dexec.mainClass=com.miniongvang.seed.SeedCommand -Dexec.args=test
          docker compose -f docker-compose.ci.yml up --no-deps --wait --wait-timeout 120 backend-test
      - name: Wait for restarted backend HTTP readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$API_BASE_URL/api/health" > /dev/null; then
              echo "Backend ready after attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs --tail=100 backend-test
          exit 1
      - name: Smoke test T12 delivery progress and completion
        run: npm run smoke:progress --prefix tools/api
      - name: Prepare clean fixtures for TX4 live browser checks
        run: |
          docker compose -f docker-compose.ci.yml stop backend-test
          docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d mini_ong_vang_test < scripts/reset-test-db.sql
          mvn --batch-mode --no-transfer-progress -f src/backend/pom.xml exec:java -Dexec.mainClass=com.miniongvang.seed.SeedCommand -Dexec.args=test
          docker compose -f docker-compose.ci.yml up --no-deps --wait --wait-timeout 120 backend-test
      - name: Build and test TX4 frontend against real backend and SQL Server
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:18081
        run: |
          npm ci --prefix src/frontend
          npm exec --prefix src/frontend -- playwright install --with-deps chromium
          npm run build --prefix src/frontend
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$API_BASE_URL/api/health" > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --max-time 2 "$API_BASE_URL/api/health"
          npm run test:tx4:live --prefix src/frontend
      - name: Reconcile designV1 invariants and policy triggers
        run: docker compose -f docker-compose.ci.yml exec -T db-test /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d mini_ong_vang_test < scripts/check-design-v1-invariants.sql
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.ci.yml logs --no-color > test-results/compose.log 2>&1
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            src/backend/target/surefire-reports/
            test-results/
            src/frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated environment
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
